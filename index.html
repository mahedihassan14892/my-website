<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাইক স্ট্যান্ড কন্ট্রোল সিস্টেম</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBD2x5i_3hzPuLSIo88llk3-DVuG09S5_c",
            authDomain: "chandrima-stand.firebaseapp.com",
            projectId: "chandrima-stand",
            storageBucket: "chandrima-stand.firebasestorage.app",
            messagingSenderId: "687907419157",
            appId: "1:687907419157:web:5feccba5169134c90c8a1c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // স্ট্যান্ডের কনফিগারেশন
        const STAND_LAT = 23.7593235;
        const STAND_LNG = 90.3438454;
        const GEOFENCE_LIMIT = 200;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        window.registerRider = async (type) => {
            const name = document.getElementById('riderName').value;
            const phone = document.getElementById('riderPhone').value;
            if(!name || !phone) { alert('নাম ও ফোন নম্বর দিন'); return; }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const dist = calculateDistance(lat, lng, STAND_LAT, STAND_LNG);

                    if(dist <= GEOFENCE_LIMIT || type === 'manual') {
                        await setDoc(doc(db, "riders", phone), {
                            name, phone, status: 'in', entryTime: new Date().toISOString(), type: type, distance: dist.toFixed(2)
                        });
                        alert(type === 'auto' ? 'অটো সিরিয়ালে যুক্ত হয়েছেন!' : 'ম্যানুয়াল সিরিয়ালে যুক্ত হয়েছেন!');
                    } else {
                        alert('আপনি স্ট্যান্ডের ২০০ মিটার সীমানার বাইরে আছেন।');
                    }
                }, () => { alert('লোকেশন পারমিশন আবশ্যক।'); });
            } else {
                alert('আপনার ব্রাউজার লোকেশন সাপোর্ট করে না।');
            }
        };

        onSnapshot(collection(db, "riders"), (snapshot) => {
            let html = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                html += `<div class="p-4 border-b flex justify-between items-center bg-white mb-2 shadow-sm rounded">
                    <div>
                        <h4 class="font-bold">${data.name}</h4>
                        <p class="text-sm text-gray-500">${data.phone} (${data.type === 'auto' ? 'অটো' : 'ম্যানুয়াল'})</p>
                    </div>
                    <span class="px-2 py-1 bg-green-100 text-green-800 text-xs font-semibold rounded">সিরিয়ালে আছেন</span>
                </div>`;
            });
            document.getElementById('serialList').innerHTML = html;
        });

        window.runAdminAction = () => {
            const pass = document.getElementById('adminPass').value;
            if(pass === "692372") {
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('adminPass').value = '';
            } else {
                alert('ভুল পাসওয়ার্ড');
            }
        };
    </script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-center">বাইক স্ট্যান্ড কন্ট্রোল</h1>
        
        <!-- রেজিস্ট্রেশন প্যানেল -->
        <div class="bg-white p-6 rounded shadow mb-6">
            <h3 class="font-bold mb-4 text-lg">রাইডার এন্ট্রি</h3>
            <input type="text" id="riderName" placeholder="আপনার নাম" class="w-full p-2 border mb-2 rounded">
            <input type="tel" id="riderPhone" placeholder="ফোন নম্বর" class="w-full p-2 border mb-4 rounded">
            <div class="flex gap-2">
                <button onclick="registerRider('auto')" class="flex-1 bg-blue-600 text-white p-2 rounded font-bold">অটো সিরিয়াল</button>
                <button onclick="registerRider('manual')" class="flex-1 bg-green-600 text-white p-2 rounded font-bold">ম্যানুয়াল সিরিয়াল</button>
            </div>
        </div>

        <!-- লাইভ সিরিয়াল লিস্ট -->
        <div class="mb-6">
            <h3 class="font-bold mb-4 text-lg">লাইভ সিরিয়াল</h3>
            <div id="serialList"></div>
        </div>
        
        <!-- এডমিন সেকশন -->
        <div class="bg-white p-6 rounded shadow">
            <h3 class="font-bold mb-4 text-lg">এডমিন প্যানেল</h3>
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড" class="w-full p-2 border mb-2 rounded">
            <button onclick="runAdminAction()" class="w-full bg-red-600 text-white p-2 rounded font-bold">লগইন</button>
        </div>

        <div id="adminPanel" class="hidden mt-4 p-6 bg-red-50 border border-red-200 rounded">
            <h2 class="font-bold text-red-600 text-xl mb-2">এডমিন কন্ট্রোল অ্যাক্টিভ</h2>
            <p class="text-sm text-gray-700">এখান থেকে আপনি রাইডারদের সময় ও দূরত্ব নিয়ন্ত্রণ করতে পারবেন এবং নোটিশ বোর্ডে বার্তা পাঠাতে পারবেন।</p>
        </div>
    </div>
</body>
</html>
